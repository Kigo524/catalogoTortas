<div>
    <h1>Menu de tortas</h1>

    <input class="buscador" type="text" placeholder="Busca por nombre o ingredientes"
    [(ngModel)]="filtro" />

    <p>
        Mostrando {{tortasFiltradas().length}} de {{tortas().length}} tortas
    </p>

    <div>
        @for (torta of tortasFiltradas(); track torta.id) {
            <div class="torta-card">
                <div class="torta-info">
                    <h3>{{torta.nombre}}</h3>
                    <p class="ingredientes">
                        <strong>Ingredientes:</strong> {{torta.ingredientes.join(', ')}`}
                    </p>
                </div>
                <div class="precio">
                    ${{torta.precio}}
                </div>

            </div>
        } @empty {
            <div class="sin-resultados">
                No se encontraron tortas con "{{filtro()}}"
            </div>
        }
    </div>
</div>
